name: openclaw
description: Zero-trust adapter profile for OpenClaw Autonomous Multi-Agent Framework
agent_command: openclaw

shell:
  safe_commands:
    - ls
    - cat
    - head
    - tail
    - pwd
    - echo
    - which
    - whoami
    - git status
    - git diff
    - git log
    - git branch
    - node
    - python3
    - pytest
    - npm test
    - env
    - date
  dangerous_patterns:
    - 'rm\s+-rf'
    - 'curl.*\|\s*(?:ba)?sh'
    - 'wget.*\|\s*(?:ba)?sh'
    - '>\s*/dev/sd[a-z]'
    - 'dd\s+if='
    - 'chmod\s+(?:-R\s+)?777'
    - ':\(\)\s*\{'
    - '\.ssh(?:/|$)'
    - '\.aws(?:/|$)'
    - '\.env(?:/|$)'
    - 'mkfs.*'
  block_tainted_only: true
  hitl_prompt: false

vault:
  enabled: true
  entropy_threshold: 4.2
  min_token_length: 24
  whitelisted_endpoints:
    - https://api.openai.com
    - https://api.anthropic.com
    - https://openrouter.ai/api
    - http://127.0.0.1:11434
    - http://localhost:11434
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:18443
    - http://localhost:18443
  custom_patterns:
    - 'sk-[a-zA-Z0-9_-]{20,}'
    - 'gh[pousr]_[A-Za-z0-9_]{36,}'
    - 'AKIA[0-9A-Z]{16}'
    - 'openclaw-[a-zA-Z0-9_-]{24,}'
  token_prefix: AG_VAULT_TOKEN

intent:
  enabled: true
  drift_threshold: 0.65
  block_on_drift: false

filesystem:
  monitored_paths:
    - .
    - .openclaw
    - workspace
    - memory
  monitored_extensions:
    - .md
    - .json
    - .sql
    - .sqlite
    - .txt
    - .yaml
    - .yml
    - .py
    - .sh
    - .ts
    - .js
  instructional_stripper:
    enabled: true
    patterns:
      - '(?i)(ignore\s+(?:all\s+)?previous\s+instructions)'
      - '(?i)(system\s*override)'
      - '(?i)(execute\s+the\s+following)'
      - '(?i)(disregard\s+(?:all\s+)?prior)'
    replacement_tag: '[DECLARATIVE INACTIVE TEXT: MATCH]'
  provenance_stamping: true
