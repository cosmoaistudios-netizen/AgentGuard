[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "OS-level zero-trust security kernel and daemon for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentGuard Authors", email = "maintainers@agentguard.dev" }
]
keywords = [
    "security",
    "zero-trust",
    "ai-agents",
    "sandbox",
    "taint-tracking",
    "secret-vault",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml",
    "rich",
    "watchfiles",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ag = "agentguard.cli:main"
agentguard = "agentguard.cli:main"

[project.urls]
Homepage = "https://github.com/agentguard/agentguard"
Repository = "https://github.com/agentguard/agentguard"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard*"]

[tool.setuptools.package-data]
agentguard = [
    "profiles/*.yaml",
    "profiles/*.yml",
    "interceptors/shim_binary/*.c",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
